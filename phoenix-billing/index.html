<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Phoenix Practice Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap">
<style>
/* Layout: indigo brand rail on the left (bottom bar on phones); soft cards on a pale sage ground. */
:root{
  --indigo:#1d165b; --indigo-2:#2c2478; --green:#19711a; --lime:#84c21e; --lime-soft:#e5f4e0;
  --bg:#f5f7f2; --surface:#ffffff; --surface-2:#eef2ea; --ink:#1d1a3a; --muted:#5f5d72; --line:#e1e6dc;
  --brand:#1d165b; --on-brand:#ffffff; --brand-soft:#ebe9f7;
  --link:#19711a; --green-ink:#19711a; --good:#19711a; --good-soft:#e5f4e0; --warn:#8a5a00; --warn-soft:#fbf0d6; --bad:#b03a2e; --bad-soft:#fbe4e0;
  --rail:#1d165b; --rail-ink:#d9d6f2; --rail-active:#2c2478;
  --av-l:46%; --shadow:0 1px 2px rgba(29,22,91,.05),0 8px 28px rgba(29,22,91,.07);
  --f:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#110e2b; --surface:#1a163d; --surface-2:#231e4d; --ink:#ecebf7; --muted:#a9a6c4; --line:#2e2960;
  --brand:#a99ff0; --on-brand:#110e2b; --brand-soft:#2a2461;
  --link:#9fd65a; --green-ink:#9fd65a; --good:#8fd16a; --good-soft:#1d3320; --warn:#e8b64f; --warn-soft:#3a2e12; --bad:#f08f80; --bad-soft:#40201c;
  --lime-soft:#22361c; --rail:#0c0a22; --rail-ink:#c3bfe6; --rail-active:#231e4d;
  --av-l:40%; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#110e2b; --surface:#1a163d; --surface-2:#231e4d; --ink:#ecebf7; --muted:#a9a6c4; --line:#2e2960;
  --brand:#a99ff0; --on-brand:#110e2b; --brand-soft:#2a2461;
  --link:#9fd65a; --green-ink:#9fd65a; --good:#8fd16a; --good-soft:#1d3320; --warn:#e8b64f; --warn-soft:#3a2e12; --bad:#f08f80; --bad-soft:#40201c;
  --lime-soft:#22361c; --rail:#0c0a22; --rail-ink:#c3bfe6; --rail-active:#231e4d;
  --av-l:40%; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;text-wrap:balance;letter-spacing:-.015em;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px;border-radius:8px}
.muted{color:var(--muted)}
.caps{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--green-ink)}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* Shell */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);padding:22px 14px 18px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh}
.wordmark{padding:2px 10px;line-height:1}
.wordmark b{display:block;font-size:27px;font-weight:800;color:#fff;letter-spacing:-.02em}
.wordmark span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.32em;color:var(--lime);margin-top:5px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;text-decoration:none;color:var(--rail-ink);font-weight:500;position:relative}
.nav a svg{width:20px;height:20px;flex:none}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a[aria-current="page"]{background:var(--rail-active);color:#fff;font-weight:700}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--lime)}
.nav .count{margin-left:auto;background:var(--lime);color:#1d165b;font-size:12px;font-weight:800;border-radius:99px;min-width:21px;text-align:center;line-height:20px;padding:0 6px}
.specialist{margin-top:auto;background:rgba(255,255,255,.06);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.specialist .who{display:flex;gap:10px;align-items:center}
.specialist b{color:#fff;font-size:14.5px;display:block}
.specialist small{font-size:12.5px;display:block}
.specialist .online{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--lime)}
.specialist .online::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--lime)}
.specialist button{background:var(--lime);color:#1d165b;border:0;border-radius:10px;padding:8px 10px;font-weight:700;cursor:pointer}
.specialist button:hover{filter:brightness(1.06)}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px 32px;background:var(--bg);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top .crumb{margin-right:auto;min-width:0;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .crumb strong{color:var(--ink)}
.top .mini-mark{display:none;font-weight:800;font-size:20px;color:var(--brand);letter-spacing:-.02em}
.view{padding:28px 32px 56px;max-width:1220px;width:100%}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 15px;font-weight:600;font-size:14.5px;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn svg{width:17px;height:17px;flex:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--indigo-2);border-color:var(--indigo-2)}
:root:not([data-theme="light"]) .btn.primary:hover{filter:brightness(1.08)}
.btn.lime{background:var(--lime);border-color:var(--lime);color:#1d165b}
.btn.lime:hover{filter:brightness(1.05)}
.btn.soft{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--link)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:6px 12px;font-size:13.5px;border-radius:10px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;width:40px;height:40px;display:inline-grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:19px;height:19px}

/* Avatars */
.av{--h:250;display:inline-grid;place-items:center;flex:none;width:40px;height:40px;border-radius:50%;background:hsl(var(--h) 45% var(--av-l));color:#fff;font-weight:700;font-size:14px;letter-spacing:.02em;box-shadow:0 0 0 3px var(--surface)}
.av.lg{width:64px;height:64px;font-size:22px}
.av.sm{width:30px;height:30px;font-size:11.5px;box-shadow:none}
.av.xs{width:24px;height:24px;font-size:10px;box-shadow:none}

/* Persona switcher */
.persona{position:relative}
.persona-btn{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 14px 4px 4px;cursor:pointer;max-width:280px}
.persona-btn:hover{background:var(--surface-2)}
.persona-btn .who{text-align:left;line-height:1.25;min-width:0}
.persona-btn .who b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.persona-btn .who span{font-size:12px;color:var(--muted);white-space:nowrap}
.persona-btn .av{box-shadow:none}
.pop{position:absolute;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:320px;max-width:calc(100vw - 32px);padding:8px;z-index:40;max-height:72vh;overflow:auto}
.pop .caps{padding:8px 10px}
.pop-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:10px;cursor:pointer}
.pop-item:hover{background:var(--surface-2)}
.pop-item[aria-checked="true"]{background:var(--lime-soft)}
.pop-item small{display:block;color:var(--muted);font-size:12.5px}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 0}

.demo-note{font-size:13px;color:var(--muted);background:var(--surface-2);padding:8px max(16px,env(safe-area-inset-right,0px)) 8px 32px}
.demo-note b{color:var(--ink)}

/* Cards and sections */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 6px}
.card-h h3{font-size:17px}
.card-b{padding:8px 20px 18px}
.stack{display:flex;flex-direction:column;gap:20px}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
.empty{padding:22px 4px;color:var(--muted);text-align:center}

.welcome{background:var(--indigo);color:#fff;border-radius:22px;padding:28px 30px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end;position:relative;overflow:hidden}
.welcome::after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:repeating-linear-gradient(180deg,var(--lime) 0 9px,transparent 9px 18px);opacity:.22;pointer-events:none}
.welcome .caps{color:var(--lime)}
.welcome h1{font-size:clamp(26px,3.4vw,36px);font-weight:800;margin:6px 0 8px;color:#fff}
.welcome p{max-width:60ch;color:#d9d6f2;font-size:16.5px}
.welcome p strong{color:#fff}
.welcome .actions{display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.welcome .btn{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff}
.welcome .btn:hover{background:rgba(255,255,255,.16)}
.welcome .btn.lime{background:var(--lime);color:#1d165b;border-color:var(--lime)}

.todo{display:flex;gap:14px;align-items:flex-start;padding:14px 0;min-width:0}
.todo + .todo{border-top:1px solid var(--line)}
.todo .body{flex:1;min-width:0}
.todo .body p{font-size:15px}
.todo .meta{font-size:13px;color:var(--muted);margin-top:2px}
.todo .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.todo .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--lime-soft);color:var(--green-ink)}
.todo .ic svg{width:20px;height:20px}
.todo .ic.money{background:var(--warn-soft);color:var(--warn)}

.money{display:flex;flex-direction:column;gap:12px}
.money .big{font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1}
.money .delta{font-size:14px;color:var(--good);font-weight:600}
.money .delta.down{color:var(--bad)}
.bars{width:100%;max-width:440px;height:auto;display:block}
.bars text{fill:var(--muted);font-size:11px;font-family:var(--f)}
.bars rect.b{fill:var(--brand-soft)}
.bars rect.b.cur{fill:var(--lime)}
.bars text.v{fill:var(--ink);font-weight:700}

.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.fact .n{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.fact .l{font-size:13.5px;color:var(--muted)}
.fact .hint{font-size:12.5px;color:var(--good);font-weight:600}

.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.feed-item{display:flex;gap:12px;padding:10px 0;align-items:flex-start;font-size:14.5px}
.feed-item + .feed-item{border-top:1px solid var(--line)}
.feed-item .meta{font-size:12.5px;color:var(--muted)}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border-radius:99px;padding:3px 10px;white-space:nowrap;line-height:18px}
.pill.pending{background:var(--warn-soft);color:var(--warn)}
.pill.accepted,.pill.booked{background:var(--brand-soft);color:var(--brand)}
.pill.completed,.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.declined,.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.urgent{background:var(--bad-soft);color:var(--bad)}
.pill.plain{background:var(--surface-2);color:var(--muted)}
.pill.cash{background:var(--warn-soft);color:var(--warn)}
.pill.ins{background:var(--brand-soft);color:var(--brand)}
.pill.new{background:var(--lime);color:#1d165b}

/* Directory */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.input,select.input,textarea.input{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 13px;width:100%;min-width:0}
textarea.input{resize:vertical;min-height:90px;line-height:1.5}
.input:focus{outline:2px solid var(--lime);outline-offset:0;border-color:transparent}
.search{flex:1 1 260px;position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search .input{padding-left:38px}
.toolbar select.input{width:auto;flex:0 1 auto}
.check{display:inline-flex;align-items:center;gap:8px;font-size:14.5px;cursor:pointer}
.check input{accent-color:var(--green);width:17px;height:17px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head h1{font-size:clamp(24px,3vw,30px);font-weight:800}
.page-head p{color:var(--muted);margin-top:4px;max-width:62ch}
.person{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.person.featured{border-color:var(--lime);box-shadow:0 0 0 3px var(--lime-soft)}
.person-h{display:flex;gap:14px;align-items:center;min-width:0}
.person-h > div{min-width:0}
.person-h b{display:block;font-size:17px}
.person-h .spec{color:var(--green-ink);font-weight:600;font-size:14px}
.person .where{font-size:14px;color:var(--muted)}
.person .bio{font-size:14.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.person .tags{display:flex;gap:6px;flex-wrap:wrap}
.person .reply{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.person .reply::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--lime)}
.person .acts{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
.person .acts .btn{flex:1}
.you{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--green-ink);margin-left:6px}

/* Messages */
.msgs{display:grid;grid-template-columns:330px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);height:calc(100vh - 200px);min-height:480px;overflow:hidden}
.tlist{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tlist-h{padding:14px;display:flex;gap:8px;border-bottom:1px solid var(--line)}
.tlist-b{overflow:auto;flex:1;padding:6px}
.titem{display:flex;gap:12px;padding:11px;border:0;background:none;width:100%;text-align:left;cursor:pointer;border-radius:12px;min-width:0}
.titem:hover{background:var(--surface-2)}
.titem[aria-current="true"]{background:var(--lime-soft)}
.titem .av{box-shadow:none}
.titem .body{flex:1;min-width:0}
.titem .l1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.titem .l1 b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titem .l1 time{font-size:12px;color:var(--muted);flex:none}
.titem .prev{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.titem.unread .prev{color:var(--ink);font-weight:600}
.titem.unread .l1 b::after{content:"";display:inline-block;width:8px;height:8px;background:var(--lime);border-radius:50%;margin-left:7px;vertical-align:middle}
.convo{display:flex;flex-direction:column;min-height:0;min-width:0}
.convo-h{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.convo-h .av{box-shadow:none}
.convo-h .who{flex:1;min-width:0}
.convo-h .who b{display:block}
.convo-h .who span{font-size:13px;color:var(--muted)}
.convo-b{flex:1;overflow:auto;padding:20px 18px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.day{align-self:center;font-size:12.5px;color:var(--muted);padding:8px 0 2px;font-weight:600}
.line{display:flex;gap:8px;align-items:flex-end;max-width:min(78%,560px)}
.line.me{align-self:flex-end;flex-direction:row-reverse}
.line .av{box-shadow:none}
.bub{padding:10px 14px;border-radius:18px 18px 18px 6px;background:var(--surface);border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.line.me .bub{background:var(--brand);color:var(--on-brand);border-color:var(--brand);border-radius:18px 18px 6px 18px}
.bub time{display:block;font-size:11.5px;opacity:.7;margin-top:3px}
.bub .tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.8;margin-bottom:2px}
.typing{font-size:13px;color:var(--muted);padding:2px 4px}
.typing i{display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:3px;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);align-items:flex-end}
.composer textarea{flex:1;resize:none;min-height:46px;max-height:140px}
.convo-empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted);padding:24px}

/* Referrals */
.tabs{display:flex;gap:6px;margin-bottom:14px;background:var(--surface-2);padding:5px;border-radius:14px;width:max-content;max-width:100%;overflow-x:auto}
.tab{border:0;background:none;padding:8px 16px;font-weight:600;color:var(--muted);cursor:pointer;border-radius:10px;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(29,22,91,.1)}
.tab .c{font-size:12px;background:var(--surface-2);border-radius:99px;padding:1px 7px;margin-left:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 13px;font-size:13.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.refs{display:flex;flex-direction:column;gap:14px}
.ref{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 24px;min-width:0}
.ref-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ref h3{font-size:18px;margin-top:8px}
.ref .reason{margin-top:3px;overflow-wrap:anywhere}
.ref .party{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:12px;flex-wrap:wrap;color:var(--muted)}
.ref .party b{color:var(--ink);font-weight:600}
.ref .note{margin-top:12px;font-size:14.5px;background:var(--surface-2);border-radius:12px;padding:10px 14px;overflow-wrap:anywhere;font-style:italic}
.ref .note .by{font-style:normal;font-size:12.5px;color:var(--muted);display:block;margin-top:4px}

.claim{display:flex;gap:14px;padding:14px 0;align-items:flex-start;min-width:0}
.claim + .claim{border-top:1px solid var(--line)}
.claim .body{flex:1;min-width:0}
.claim .amt{font-weight:700;white-space:nowrap}
.claim .meta{font-size:13px;color:var(--muted)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
.services{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.service{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px;min-width:0}

.callout h3{font-size:18px;margin-bottom:4px}
.callout p{font-size:14.5px}

}
function openJoin(){
  modal("Welcome a new doctor",'<form data-form="join"><p class="hint" style="font-size:14px">Every practice that signs up with Phoenix Medical Billing gets a spot on the hub. Fill this in to show how it looks.</p>'+
  '<div class="two"><label class="field"><span>First name</span><input class="input" name="first" id="jFirst" required placeholder="Sarah"></label><label class="field"><span>Last name</span><input class="input" name="last" id="jLast" required placeholder="Kim"></label></div>'+
  '<div class="two"><label class="field"><span>Specialty</span><select class="input" name="specialty" id="jSpec">'+SPECIALTIES.map(s=>'<option>'+esc(s)+'</option>').join("")+'</select></label><label class="field"><span>Credentials</span><input class="input" name="cred" id="jCred" value="MD"></label></div>'+
  '<div class="two"><label class="field"><span>Practice name</span><input class="input" name="clinic" id="jClinic" required placeholder="Arcadia Family Health"></label><label class="field"><span>City</span><input class="input" name="city" id="jCity" required value="Phoenix"></label></div>'+
  '<label class="field"><span>How do patients pay?</span><select class="input" name="pay" id="jPay"><option value="insurance">Insurance</option><option value="both">Insurance and self-pay</option><option value="cash">Cash-pay only</option></select></label>'+
  '<label class="field"><span>A line about them</span><input class="input" name="bio" id="jBio" placeholder="What they love treating"></label>'+
  '<label class="check"><input type="checkbox" name="switch" id="jSwitch" checked> Show me the hub as this doctor</label>'+
  '<div class="foot"><button class="btn" type="button" data-action="close-modal">Cancel</button><button class="btn lime" type="submit">'+I.plus+'Add to the hub</button></div></form>');
}
function openDecline(id){modal("Can’t take this patient?",'<form data-form="decline" data-id="'+esc(id)+'"><label class="field"><span>Let your colleague know why</span><textarea class="input" name="reason" id="dReason" required placeholder="e.g. We’re booked out until January. Dr. Nguyen might be able to see them sooner."></textarea></label><div class="foot"><button class="btn" type="button" data-action="close-modal">Cancel</button><button class="btn primary" type="submit">Send</button></div></form>');}
function openBook(id){modal("Book the appointment",'<form data-form="book" data-id="'+esc(id)+'"><label class="field"><span>Date</span><input class="input" type="date" name="date" id="bDate" required value="'+isoDay(Date.now()+5*DAY)+'"></label><p class="hint">We’ll let the referring doctor know.</p><div class="foot"><button class="btn" type="button" data-action="close-modal">Cancel</button><button class="btn primary" type="submit">Book it</button></div></form>');}
function openFix(id){
  const x=billing(me()).issues.find(i=>i.id===id); if(!x) return;
  modal("Help Maria fix this claim",'<form data-form="fix" data-id="'+esc(id)+'"><dl class="kv"><dt>Claim</dt><dd>'+x.claimNo+'</dd><dt>Payer</dt><dd>'+esc(payerName(x.payer))+'</dd><dt>Patient</dt><dd>'+esc(x.patient)+', seen '+x.dos+'</dd><dt>Service</dt><dd>CPT '+x.cpt+' · '+esc(x.cptText)+'</dd><dt>Diagnosis</dt><dd>ICD-10 '+x.icd+'</dd><dt>Denial code</dt><dd>'+x.carc+' · '+esc(x.carcText)+'</dd><dt>Amount</dt><dd>'+usd2(x.amount)+'</dd><dt>Resubmit by</dt><dd>'+x.resubmitBy+'</dd></dl><div class="notice">'+esc(x.problem)+'</div><label class="field"><span>'+esc(x.ask)+'</span><input class="input" name="answer" id="fAnswer" required placeholder="'+esc(x.ph)+'"></label><p class="hint">Maria will update the claim and resubmit it today.</p><div class="foot"><button class="btn" type="button" data-action="close-modal">Not now</button><button class="btn primary" type="submit">Send to Maria</button></div></form>');
}

/* ---------- Actions ---------- */
function postMessage(t,from,text,extra){const m=Object.assign({from,text,ts:Date.now()},extra||{});t.messages.push(m);t.read=t.read||{};t.read[from]=m.ts;return m;}
const REPLIES=["Thanks for this! I’ll take a look this afternoon.","Got it. Could you send over the most recent notes when you get a chance?","Happy to help. We have openings next week.","Thank you, I’ll have my front desk reach out to the patient today.","Sounds good. Let’s catch up after the visit.","Really appreciate you thinking of us."];
function simReply(t,fromId,text){
  setTimeout(()=>{ui.typing[t.id]=true;if(route()==="messages"&&ui.thread===t.id)render();},900);
  setTimeout(()=>{ui.typing[t.id]=false;postMessage(t,fromId,text||REPLIES[Math.floor(Math.random()*REPLIES.length)]);
    const viewing=route()==="messages"&&ui.thread===t.id;
    if(viewing){t.read[S.me]=Date.now();} else if(t.members.includes(S.me)) toast('<b>'+esc(short(doc(fromId)))+'</b> replied to you');
    save();render();},3300);
}
function sendMessage(t,text){
  postMessage(t,S.me,text);save();render();
  if(!S.sim) return; const o=other(t);
  simReply(t,o.id,o.team?"Thanks, Dr. "+me().last+"! I’m on it and will message you as soon as it’s done.":null);
}
function createReferral(fd){
  const r={id:"R-"+(++S.seq),from:S.me,to:fd.get("to"),patient:fd.get("patient").trim().toUpperCase(),age:Number(fd.get("age")),sex:fd.get("sex"),reason:fd.get("reason").trim(),coverage:fd.get("coverage"),icd:(fd.get("icd")||"").trim().toUpperCase(),urgency:fd.get("urgency")||"routine",status:"pending",created:Date.now(),note:(fd.get("note")||"").trim()};
  r.history=[{status:"pending",ts:r.created,by:S.me}];S.referrals.push(r);
  const to=doc(r.to), t=threadWith(r.to,true), sender=me();
  postMessage(t,S.me,"I’ve sent you "+r.patient+" ("+r.age+r.sex+"): "+r.reason+(r.note?"\n\n"+r.note:""),{tag:"Referral "+r.id});
  addActivity("<b>"+esc(short(sender))+"</b> sent a patient to <b>"+esc(short(to))+"</b>");
  save();closeModal();toast("Sent! <b>"+esc(short(to))+"</b> has your referral for "+esc(r.patient));
  ui.refTab="outbound";ui.refFilter="all";if(route()!=="referrals")location.hash="#referrals";else render();
  if(S.sim) setTimeout(()=>{if(r.status!=="pending")return;setStatus(r,"accepted",r.to);postMessage(t,r.to,"Thanks for sending "+r.patient+" our way! We’ll call them today to get them booked.",{tag:"Referral "+r.id});addActivity("<b>"+esc(short(to))+"</b> accepted a patient from <b>"+esc(short(sender))+"</b>");save();if(S.me===sender.id)toast("<b>"+esc(short(to))+"</b> accepted "+esc(r.patient));render();},7000);
}
function setStatus(r,s,by){r.status=s;(r.history=r.history||[]).push({status:s,ts:Date.now(),by});}
function refAction(kind,id,extra){
  const r=S.referrals.find(x=>x.id===id);if(!r)return;const f=doc(r.from),t=threadWith(r.from,true),m=me(),tag={tag:"Referral "+r.id};
  if(kind==="accept"){setStatus(r,"accepted",S.me);postMessage(t,S.me,"Thanks for sending "+r.patient+"! We’ll reach out to get them booked.",tag);addActivity("<b>"+esc(short(m))+"</b> accepted a patient from <b>"+esc(short(f))+"</b>");toast("You accepted <b>"+esc(r.patient)+"</b>. We let "+esc(short(f))+" know.");}
  if(kind==="decline"){setStatus(r,"declined",S.me);r.declineReason=extra;postMessage(t,S.me,"I’m sorry, I can’t take "+r.patient+" right now. "+extra,tag);toast("We let "+esc(short(f))+" know.");}
  if(kind==="book"){setStatus(r,"booked",S.me);r.appt=extra;postMessage(t,S.me,r.patient+" is booked for "+apptLabel(extra)+".",tag);toast("Booked "+esc(r.patient)+" for "+apptLabel(extra));}
  if(kind==="complete"){setStatus(r,"completed",S.me);r.claim=true;postMessage(t,S.me,"Saw "+r.patient+" today. Thanks again for the referral. Notes to follow.",tag);addActivity("<b>"+esc(short(m))+"</b> saw a patient sent by <b>"+esc(short(f))+"</b>");toast("Marked as seen. <b>Phoenix</b> is billing the visit.");}
  save();closeModal();render();
}
function thank(id){
  const r=S.referrals.find(x=>x.id===id);if(!r)return;const t=doc(r.to),th=threadWith(r.to,true);
  r.thanked=true;postMessage(th,S.me,"Thank you for taking such good care of "+r.patient+". It means a lot to me and to them.",{tag:"Thank you"});
  addActivity("<b>"+esc(short(me()))+"</b> thanked <b>"+esc(short(t))+"</b> for seeing a patient");save();toast("Thank-you sent to <b>"+esc(short(t))+"</b>");render();
}
function joinDoctor(fd){
  const pay=fd.get("pay");
  const d={id:"d"+Date.now(),first:fd.get("first").trim(),last:fd.get("last").trim(),cred:fd.get("cred").trim(),specialty:fd.get("specialty"),clinic:fd.get("clinic").trim(),city:fd.get("city").trim(),hue:Math.floor(Math.random()*360),joined:Date.now(),accepting:true,pay,payers:pay==="cash"?[]:["Aetna","Blue Cross Blue Shield of AZ","UnitedHealthcare"],languages:["English"],years:1+Math.floor(Math.random()*20),reply:"within a day",bio:(fd.get("bio")||"").trim()||"New to the Phoenix network and looking forward to working with you.",goodFor:[fd.get("specialty")]};
  d.npi="1"+String(Math.floor(100000000+Math.random()*899999999));d.phone="(602) 555-0199";d.address="100 N Example Rd, Suite 100, "+d.city+", AZ";S.doctors.push(d);addActivity("<b>"+esc(full(d))+"</b> joined from "+esc(d.clinic)+", "+esc(d.city));
  S.threads.push({id:"t"+Date.now(),members:[d.id,"phx"],read:{},messages:[{from:"phx",text:"Welcome to the hub, "+short(d)+"! I’m Maria, your billing specialist. You’re now visible to "+(members().length-1)+" doctors across the Valley who can send you patients. Let’s set up a quick onboarding call this week.",ts:Date.now()}]});
  if(fd.get("switch"))S.me=d.id;save();closeModal();toast("<b>"+esc(full(d))+"</b> is on the hub");if(fd.get("switch"))location.hash="#home";render();
}

/* ---------- Events ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-action]");
  if(ui.pop&&!e.target.closest(".pop")&&!(el&&el.dataset.action==="toggle-persona")){ui.pop=null;renderChrome();}
  if(!el)return;const a=el.dataset.action,id=el.dataset.id;
  if(a==="scrim"){if(e.target===el)closeModal();return;}
  if(a==="close-modal")return closeModal();
  if(a==="toggle-persona"){ui.pop=ui.pop==="persona"?null:"persona";return renderChrome();}
  if(a==="switch-me"){S.me=id;ui.pop=null;ui.thread=null;ui.refTab="inbound";ui.refFilter="all";save();toast("You’re now seeing the hub as <b>"+esc(full(doc(id)))+"</b>");return render();}
  if(a==="toggle-sim"){S.sim=!S.sim;save();return renderChrome();}
  if(a==="reset"){S=seed();ui.thread=null;ui.pop=null;save();toast("Demo restored");location.hash="#home";return render();}
  if(a==="join"){ui.pop=null;renderChrome();return openJoin();}
  if(a==="new-ref")return openReferral("");
  if(a==="new-msg")return openNewMessage("");
  if(a==="refer-doc")return openReferral(id);
  if(a==="profile")return openProfile(id);
  if(a==="msg-doc"){closeModal();const t=threadWith(id,true);ui.thread=t.id;t.read=t.read||{};t.read[S.me]=Date.now();save();if(route()!=="messages")location.hash="#messages";else render();return;}
  if(a==="open-thread"){ui.thread=id;const t=S.threads.find(x=>x.id===id);if(t){t.read=t.read||{};t.read[S.me]=Date.now();save();}if(route()!=="messages")location.hash="#messages";else render();setTimeout(()=>{const c=$("#composer");if(c&&innerWidth>780)c.focus();},0);return;}
  if(a==="back-threads"){ui.thread=null;return render();}
  if(a==="ref-tab"){ui.refTab=el.dataset.tab;ui.refFilter="all";return render();}
  if(a==="ref-filter"){ui.refFilter=el.dataset.f;return render();}
  if(a==="ref-accept")return refAction("accept",id);
  if(a==="ref-decline")return openDecline(id);
  if(a==="ref-book")return openBook(id);
  if(a==="ref-complete")return refAction("complete",id);
  if(a==="thank")return thank(id);
  if(a==="fix")return openFix(id);
  if(a==="remind"){S.reminded[id]=true;save();toast("Payment link texted to the patient");return render();}
  if(a==="service"){const s=el.dataset.s,t=threadWith("phx",true);ui.thread=t.id;postMessage(t,S.me,"Hi Maria, I’d like to hear more about "+s.toLowerCase()+".");save();if(route()!=="messages")location.hash="#messages";else render();if(S.sim)simReply(t,"phx","Absolutely! I’ll put together what "+s.toLowerCase()+" would look like for your practice and send you a couple of times to talk this week.");return;}
});
document.addEventListener("submit",e=>{
  const f=e.target.closest("form[data-form]");if(!f)return;e.preventDefault();const fd=new FormData(f),k=f.dataset.form;
  if(k==="send"){const txt=(fd.get("text")||"").trim(),t=S.threads.find(x=>x.id===ui.thread);if(txt&&t)sendMessage(t,txt);return;}
  if(k==="newmsg"){const t=threadWith(fd.get("to"),true);closeModal();ui.thread=t.id;if(route()!=="messages")location.hash="#messages";sendMessage(t,fd.get("text").trim());return;}
  if(k==="referral")return createReferral(fd);
  if(k==="join")return joinDoctor(fd);
  if(k==="decline")return refAction("decline",f.dataset.id,fd.get("reason").trim());
  if(k==="book")return refAction("book",f.dataset.id,fd.get("date"));
  if(k==="fix"){const id=f.dataset.id,x=billing(me()).issues.find(i=>i.id===id);S.fixed[id]=true;const t=threadWith("phx",true);postMessage(t,S.me,"Here’s what you need for "+x.patient+"’s "+x.payer+" claim: "+fd.get("answer").trim(),{tag:"Claim fix"});save();closeModal();toast("Thanks! <b>Maria</b> will resubmit it today.");render();if(S.sim)simReply(t,"phx","Perfect, that’s all I needed. Resubmitting now, and I’ll let you know when "+x.payer+" pays.");}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if($("#modalRoot").innerHTML)closeModal();else if(ui.pop){ui.pop=null;renderChrome();}}
  if(e.key==="Enter"&&!e.shiftKey&&e.target.id==="composer"){e.preventDefault();e.target.form.requestSubmit();}
});
document.addEventListener("input",e=>{
  const id=e.target.id;
  if(id==="dirQ"||id==="tq"){if(id==="dirQ")ui.q=e.target.value;else ui.tq=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(_){}}}
});
document.addEventListener("change",e=>{
  const id=e.target.id;
  if(id==="dirSpec"){ui.spec=e.target.value;render();}
  if(id==="dirCity"){ui.city=e.target.value;render();}
  if(id==="dirPay"){ui.pay=e.target.value;render();}
  if(id==="dirOpen"){ui.openOnly=e.target.checked;render();}
  if(id==="rTo"||id==="rCov")updateCashNote();
});
window.addEventListener("hashchange",()=>{closeModal();ui.pop=null;render();});
window.addEventListener("storage",e=>{if(e.key===KEY){const n=load();if(n){S=n;render();}}});
setInterval(()=>{if(!$("#modalRoot").innerHTML&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))render();},60000);
render();
})();
</script>
</body>
</html>
